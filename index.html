<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FinanceFlow - Expense Tracker</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>

<body>

  <div class="background"></div>

  <div class="container">

    <header>
      <h1>FinanceFlow</h1>
      <p>Smart Expense Management</p>
    </header>

    <section class="dashboard">

      <div class="card balance-card">
        <h2>Total Balance</h2>
        <h1 id="balance">₹0</h1>
      </div>

      <div class="card income-card">
        <h3>Income</h3>
        <h2 id="income">₹0</h2>
      </div>

      <div class="card expense-card">
        <h3>Expenses</h3>
        <h2 id="expense">₹0</h2>
      </div>

    </section>

    <section class="budget-section card">

      <div class="budget-top">
        <h2>Monthly Budget Usage</h2>
        <span id="budgetPercent">0%</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

    </section>

    <section class="transaction-form card">

      <h2>Add Transaction</h2>

      <input type="text" id="title" placeholder="Transaction Title" />

      <input type="number" id="amount" placeholder="Amount" />

      <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>

      <button onclick="addTransaction()">
        Add Transaction
      </button>

    </section>

    <section class="history card">

      <h2>Transaction History</h2>

      <ul id="transactionList"></ul>

    </section>

  </div>

  <script src="app.js"></script>

</body>

</html>
